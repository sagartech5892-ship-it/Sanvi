<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS SHEET PRO</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f7;
    color:#222;
}

header{
    background:#20252b;
    color:white;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:12px;
    box-shadow:0 2px 10px #0001;
}

h2{
    margin-top:0;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    border:0;
    padding:11px 15px;
    margin:5px 3px;
    border-radius:8px;
    background:#1976d2;
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.danger{
    background:#d32f2f;
}

.success{
    background:#2e7d32;
}

.secondary{
    background:#555;
}

.hidden{
    display:none!important;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:8px;
}

.menu button{
    margin:0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#eee;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.stat{
    padding:18px;
    background:#fafafa;
    border-radius:10px;
    border:1px solid #ddd;
}

.stat strong{
    display:block;
    font-size:26px;
    margin-top:5px;
}

.empty{
    padding:20px;
    text-align:center;
    color:#777;
}
</style>
</head>

<body>

<header>📊 MS SHEET PRO</header>

<div class="container">

<!-- LOGIN -->
<section id="loginPage">

<div class="card" style="max-width:450px;margin:30px auto">

<h2>🔐 Login</h2>

<input
    id="username"
    type="text"
    placeholder="Username"
>

<input
    id="password"
    type="password"
    placeholder="Password"
>

<button onclick="login()" style="width:100%">
🔐 Login
</button>

</div>

</section>


<!-- APP -->
<section id="app" class="hidden">

<div class="card">

<div class="menu">

<button onclick="showPage('home')">🏠 Home</button>

<button onclick="showPage('draws')">📅 Draws</button>

<button onclick="showPage('party')">👥 Parties</button>

<button onclick="showPage('clients')">👤 Clients</button>

<button onclick="showPage('hisab')">🧾 Hisab</button>

<button onclick="showPage('reports')">📊 Reports</button>

<button class="danger" onclick="logout()">🚪 Logout</button>

</div>

</div>


<!-- HOME -->
<div id="home" class="page">

<div class="card">

<h2>🏠 Dashboard</h2>

<div class="stat-grid">

<div class="stat">
Draws
<strong id="totalDraws">0</strong>
</div>

<div class="stat">
Parties
<strong id="totalParties">0</strong>
</div>

<div class="stat">
Clients
<strong id="totalClients">0</strong>
</div>

<div class="stat">
Records
<strong id="totalRecords">0</strong>
</div>

</div>

</div>

</div>


<!-- DRAWS -->
<div id="draws" class="page hidden">

<div class="card">

<h2>📅 Create Draw / Record</h2>

<input id="drawName" placeholder="Draw / Event Name">

<input id="drawDate" type="date">

<button class="success" onclick="createDraw()">
➕ Add
</button>

</div>

<div class="card">

<h2>📋 Draw List</h2>

<div id="drawList"></div>

</div>

</div>


<!-- PARTY -->
<div id="party" class="page hidden">

<div class="card">

<h2>👥 Add Party</h2>

<input id="partyName" placeholder="Party Name">

<input id="partyMobile" placeholder="Mobile Number">

<textarea id="partyNote" placeholder="Note"></textarea>

<button class="success" onclick="addParty()">
➕ Add Party
</button>

</div>

<div class="card">

<h2>👥 Party List</h2>

<div id="partyList"></div>

</div>

</div>


<!-- CLIENTS -->
<div id="clients" class="page hidden">

<div class="card">

<h2>👤 Add Client</h2>

<input id="clientName" placeholder="Client Name">

<input id="clientMobile" placeholder="Mobile Number">

<input id="clientAddress" placeholder="Address">

<button class="success" onclick="addClient()">
➕ Add Client
</button>

</div>

<div class="card">

<h2>👤 Client List</h2>

<div id="clientList"></div>

</div>

</div>


<!-- HISAB -->
<div id="hisab" class="page hidden">

<div class="card">

<h2>🧾 Hisab / Account Record</h2>

<select id="hisabParty">
<option value="">Party Select करें</option>
</select>

<input
    id="hisabAmount"
    type="number"
    placeholder="Amount"
>

<select id="hisabType">
<option value="credit">Credit</option>
<option value="debit">Debit</option>
</select>

<input id="hisabNote" placeholder="Description">

<button class="success" onclick="addHisab()">
➕ Save
</button>

</div>

<div class="card">

<h2>📋 Account Records</h2>

<div id="hisabList"></div>

</div>

</div>


<!-- REPORTS -->
<div id="reports" class="page hidden">

<div class="card">

<h2>📊 Reports</h2>

<button onclick="showReports()">
🔄 Refresh Report
</button>

<button class="secondary" onclick="window.print()">
🖨️ Print
</button>

<div id="reportResult"></div>

</div>

</div>

</section>

</div>


<script>

/* =========================
   DATA
========================= */

const KEY = "ms_sheet_pro_data_v2";

const defaultData = {
    draws: [],
    parties: [],
    clients: [],
    hisab: []
};

let data = loadData();


/* =========================
   STORAGE
========================= */

function loadData(){

    try{

        const saved = localStorage.getItem(KEY);

        if(!saved){
            return structuredClone(defaultData);
        }

        const parsed = JSON.parse(saved);

        return {
            draws: Array.isArray(parsed.draws) ? parsed.draws : [],
            parties: Array.isArray(parsed.parties) ? parsed.parties : [],
            clients: Array.isArray(parsed.clients) ? parsed.clients : [],
            hisab: Array.isArray(parsed.hisab) ? parsed.hisab : []
        };

    }catch(error){

        console.error(error);

        return structuredClone(defaultData);
    }
}


function saveData(){

    localStorage.setItem(
        KEY,
        JSON.stringify(data)
    );

    refreshAll();
}


/* =========================
   LOGIN
========================= */

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    if(username === "admin" && password === "admin"){

        document.getElementById("login").style.display = "none";

        document.getElementById("app").classList.remove("hidden");
        document.getElementById("app").style.display = "block";

        showPage("home");

        refreshAll();

    }else{

        alert("गलत Username या Password");

    }
    }

function logout(){

    document.getElementById("app").style.display = "none";
    document.getElementById("app").classList.add("hidden");

    document.getElementById("login").style.display = "block";

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    }

/* =========================
   PAGE NAVIGATION
========================= */

function showPage(id){

    document
        .querySelectorAll(".page")
        .forEach(page => {
            page.classList.add("hidden");
        });

    const page =
        document.getElementById(id);

    if(!page){
        alert("Page नहीं मिली");
        return;
    }

    page.classList.remove("hidden");

    refreshAll();
}


/* =========================
   DASHBOARD
========================= */

function refreshDashboard(){

    document.getElementById("totalDraws").textContent =
        data.draws.length;

    document.getElementById("totalParties").textContent =
        data.parties.length;

    document.getElementById("totalClients").textContent =
        data.clients.length;

    document.getElementById("totalRecords").textContent =
        data.hisab.length;
}


/* =========================
   DRAW
========================= */

function createDraw(){

    const name =
        document.getElementById("drawName").value.trim();

    const date =
        document.getElementById("drawDate").value;

    if(!name || !date){

        alert("Name और Date भरें");

        return;
    }

    data.draws.push({

        id: Date.now(),

        name: name,

        date: date,

        createdAt: new Date().toLocaleString()

    });

    document.getElementById("drawName").value = "";

    document.getElementById("drawDate").value = "";

    saveData();

    alert("Record successfully add हुआ");
}


function renderDraws(){

    const box =
        document.getElementById("drawList");

    if(data.draws.length === 0){

        box.innerHTML =
            '<div class="empty">अभी कोई record नहीं है</div>';

        return;
    }

    box.innerHTML = `

    <table>

    <tr>
        <th>Name</th>
        <th>Date</th>
        <th>Action</th>
    </tr>

    ${data.draws.map(d => `

    <tr>

        <td>${escape
