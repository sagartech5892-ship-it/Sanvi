<!-- ================= MASTER SHEET ================= -->

<style>
.master-sheet {
  padding: 18px;
  background: #f5f7fb;
  border-radius: 14px;
  margin-top: 20px;
}

.master-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.master-head h2 {
  margin: 0;
  font-size: 22px;
}

.master-controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.master-controls input,
.master-controls select,
.master-controls button {
  padding: 10px 12px;
  border: 1px solid #d5dbe5;
  border-radius: 8px;
  font-size: 14px;
}

.master-controls button {
  background: #17202a;
  color: white;
  cursor: pointer;
  border: none;
}

.master-table-wrap {
  width: 100%;
  overflow-x: auto;
  background: white;
  border-radius: 10px;
}

.master-table {
  border-collapse: collapse;
  width: 100%;
  min-width: 900px;
}

.master-table th,
.master-table td {
  border: 1px solid #b9c3d0;
  text-align: left;
  padding: 6px;
}

.master-table th {
  background: #eef2f7;
  font-size: 12px;
}

.master-table td {
  height: 55px;
  min-width: 85px;
  vertical-align: top;
  position: relative;
}

.master-number {
  font-size: 11px;
  color: #687386;
  font-weight: bold;
  display: block;
  margin-bottom: 5px;
}

.master-input {
  width: 100%;
  box-sizing: border-box;
  border: 0;
  outline: none;
  font-size: 17px;
  font-weight: 600;
  background: transparent;
}

.master-total {
  background: #f0f3f7;
  font-weight: bold;
  text-align: center !important;
  vertical-align: middle !important;
  min-width: 80px;
}

.master-summary {
  display: flex;
  justify-content: flex-end;
  gap: 20px;
  padding: 12px;
  font-weight: bold;
  background: white;
  border-top: 2px solid #cbd3df;
}

@media (max-width: 600px) {
  .master-sheet {
    padding: 10px;
  }

  .master-head h2 {
    font-size: 18px;
  }

  .master-controls input,
  .master-controls select,
  .master-controls button {
    width: 100%;
  }

  .master-table {
    min-width: 850px;
  }
}
</style>

<section class="master-sheet" id="masterSheet">

  <div class="master-head">
    <h2>Ruff Master Sheet</h2>

    <div class="master-controls">
      <input type="date" id="masterDate">

      <select id="masterCategory">
        <option>DL</option>
        <option>Record</option>
        <option>History</option>
        <option>Other</option>
      </select>

      <button onclick="saveMasterSheet()">Save</button>
      <button onclick="clearMasterSheet()">Clear</button>
    </div>
  </div>

  <div class="master-table-wrap">

    <table class="master-table">
      <thead>
        <tr>
          <th>1–10</th>
          <th>11–20</th>
          <th>21–30</th>
          <th>31–40</th>
          <th>41–50</th>
          <th>51–60</th>
          <th>61–70</th>
          <th>71–80</th>
          <th>81–90</th>
          <th>91–100</th>
          <th>101–110</th>
          <th>111–120</th>
          <th>Total</th>
        </tr>
      </thead>

      <tbody id="masterBody"></tbody>
    </table>

  </div>

  <div class="master-summary">
    <span>Grand Total:</span>
    <span id="grandTotal">0</span>
  </div>

</section>

<script>
(function () {

  const body = document.getElementById("masterBody");
  const grandTotal = document.getElementById("grandTotal");
  const dateInput = document.getElementById("masterDate");

  // Current date
  const today = new Date();
  dateInput.value = today.toISOString().split("T")[0];

  // Create 120 cells
  // 10 columns per row
  // Additional rows continue until 120
  for (let row = 0; row < 10; row++) {

    const tr = document.createElement("tr");

    for (let col = 0; col < 12; col++) {

      const number = (row * 12) + col + 1;

      const td = document.createElement("td");

      if (number <= 120) {

        td.innerHTML = `
          <span class="master-number">${number}</span>
          <input
            type="number"
            min="0"
            class="master-input"
            data-number="${number}"
            placeholder=""
            oninput="calculateMasterTotal()"
          >
        `;

      } else {

        td.innerHTML = "";
      }

      tr.appendChild(td);
    }

    const totalTd = document.createElement("td");
    totalTd.className = "master-total";
    totalTd.id = "rowTotal" + row;
    totalTd.innerText = "0";

    tr.appendChild(totalTd);

    body.appendChild(tr);
  }

})();


function calculateMasterTotal() {

  let grand = 0;

  document.querySelectorAll(".master-table tbody tr").forEach(
    (row, rowIndex) => {

      let rowTotal = 0;

      row.querySelectorAll(".master-input").forEach(input => {

        const value = Number(input.value);

        if (!isNaN(value)) {
          rowTotal += value;
        }

      });

      const totalBox = document.getElementById(
        "rowTotal" + rowIndex
      );

      if (totalBox) {
        totalBox.innerText = rowTotal;
      }

      grand += rowTotal;
    }
  );

  document.getElementById("grandTotal").innerText = grand;
}


function saveMasterSheet() {

  const values = {};

  document.querySelectorAll(".master-input").forEach(input => {

    values[input.dataset.number] = input.value;

  });

  const data = {
    date: document.getElementById("masterDate").value,
    category: document.getElementById("masterCategory").value,
    values: values
  };

  localStorage.setItem(
    "sanvi_master_sheet",
    JSON.stringify(data)
  );

  alert("Master Sheet saved successfully.");
}


function loadMasterSheet() {

  const saved = localStorage.getItem("sanvi_master_sheet");

  if (!saved) return;

  try {

    const data = JSON.parse(saved);

    if (data.date) {
      document.getElementById("masterDate").value = data.date;
    }

    if (data.category) {
      document.getElementById("masterCategory").value =
        data.category;
    }

    if (data.values) {

      document.querySelectorAll(".master-input").forEach(input => {

        const number = input.dataset.number;

        if (data.values[number] !== undefined) {
          input.value = data.values[number];
        }

      });

    }

    calculateMasterTotal();

  } catch (error) {

    console.log("Unable to load saved sheet.");

  }
}


function clearMasterSheet() {

  if (!confirm("Clear all entries?")) return;

  document.querySelectorAll(".master-input").forEach(input => {
    input.value = "";
  });

  calculateMasterTotal();

  localStorage.removeItem("sanvi_master_sheet");
}


// Load saved data
setTimeout(loadMasterSheet, 100);

</script>

<!-- ================= END MASTER SHEET ================= -->
